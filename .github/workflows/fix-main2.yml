name: Fix planner build

on:
  workflow_dispatch:
  push:
    branches:
      - design/premium-warm-ui

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: design/premium-warm-ui
      - name: Fix Home icon naming conflict
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/main2.jsx')
          s = p.read_text()
          s = s.replace(',Heart,Home,Image as ImageIcon,', ',Heart,Home as HomeIcon,Image as ImageIcon,')
          s = s.replace("{id:'home',label:t.home,icon:Home}", "{id:'home',label:t.home,icon:HomeIcon}")
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main2.jsx
          git diff --cached --quiet || git commit -m "Fix Home icon naming conflict"
          git push
